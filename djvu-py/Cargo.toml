[package]
name = "djvu-py"
version = "0.40.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Python bindings for djvu-rs — pure-Rust DjVu decoder"
publish = false

[lib]
name = "djvu_rs_python"
crate-type = ["cdylib"]

[dependencies]
djvu-rs = { path = "..", features = ["std", "pdf", "epub", "cbz", "tiff", "serde"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
pythonize = "0.29"
serde = "1"

[build-dependencies]
pyo3-build-config = "0.29"
