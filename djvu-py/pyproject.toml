[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "djvu-rs"
dynamic = ["version"]
description = "Read, render, and extract text from DjVu files — Python bindings for the pure-Rust djvu-rs library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
keywords = ["djvu", "decoder", "render", "ocr", "document"]

[project.urls]
Homepage = "https://github.com/matyushkin/djvu-rs"
Repository = "https://github.com/matyushkin/djvu-rs"
Documentation = "https://github.com/matyushkin/djvu-rs/blob/main/djvu-py/README.md"
Changelog = "https://github.com/matyushkin/djvu-rs/blob/main/CHANGELOG.md"
Issues = "https://github.com/matyushkin/djvu-rs/issues"

[project.optional-dependencies]
numpy = ["numpy"]
pillow = ["Pillow"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "djvu_rs"
# Version comes from djvu-py/Cargo.toml (must match the workspace crate version).
manifest-path = "Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
test = ["pytest>=7", "numpy", "pillow"]
