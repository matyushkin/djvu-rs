# Update PRs for Cargo dependencies and GitHub Actions (#961).
#
# Grouped and weekly so a quiet week costs at most one PR per ecosystem.
# The release workflows pin actions by commit SHA with a `# vX.Y.Z` comment;
# Dependabot bumps both together.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # pythonize 0.29 requires pyo3 0.29, and Cargo links one pyo3 per build.
      # A pyo3 0.30 requirement makes the whole workspace unresolvable, so the
      # grouped PR fails every check and the Dependabot run itself fails (#974).
      # Remove this rule when pythonize supports the next pyo3 line.
      #
      # The rule names a version range, not `update-types`. Cargo.lock is not
      # tracked, so Dependabot knows no current pyo3 version, and it applies
      # `update-types` only relative to a current version: that form was
      # accepted and then ignored (#977, #980).
      - dependency-name: "pyo3*"
        versions: [">= 0.30.0"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
