name: djvu-viewer

# Browser smoke test of the <djvu-viewer> web component, and its public demo:
# https://matyushkin.github.io/djvu-rs/dev/viewer/

on:
  pull_request:
    paths:
      - 'viewer/**'
      - 'src/wasm.rs'
      - 'scripts/build_wasm_dual.sh'
      - 'scripts/build_viewer_demo.sh'
      - 'scripts/smoke_viewer_browser.mjs'
      - '.github/workflows/viewer.yml'
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'scripts/build_wasm_dual.sh'
      - 'scripts/build_viewer_demo.sh'
      - 'scripts/smoke_viewer_browser.mjs'
      - '.github/workflows/viewer.yml'
  workflow_dispatch:

concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  viewer:
    name: djvu-viewer (browser smoke + demo)
    # Pinned: Playwright 1.53.0 cannot install Chromium on ubuntu-26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write          # push the demo to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: npm-wasm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install wasm-pack
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: wasm-pack@0.13.1

      - name: Build dual wasm package
        run: OUT="$PWD/npm-pkg" make wasm

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.53.0
          npx playwright install --with-deps chromium

      - name: Browser smoke
        run: |
          node scripts/smoke_viewer_browser.mjs \
            --package npm-pkg \
            --fixture tests/fixtures/DjVu3Spec_bundled.djvu

      - name: Build demo site
        run: PKG="$PWD/npm-pkg" OUT="$PWD/viewer_site" scripts/build_viewer_demo.sh

      - name: Publish demo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: viewer_site
          destination_dir: dev/viewer
          keep_files: true
