name: Security audit

# Scheduled supply-chain checks (#961). Not merge-gating.
#
# - `advisories`: ci.yml's `Dependencies (deny + audit)` job runs only on
#   pushes and PRs, so a RustSec advisory published against a dependency we
#   already use would stay silent until the next PR. This job re-checks every
#   Monday and turns the run red.
# - `zizmor`: static analysis of the workflow files themselves (template
#   injection, over-broad tokens, unpinned actions). Findings go to the
#   repository's code-scanning alerts (Security tab) instead of failing the
#   run, so the existing backlog does not block anything.

on:
  schedule:
    - cron: '0 5 * * 1'  # every Monday at 05:00 UTC, after the fuzz and sanitizer runs
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec advisories
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Advisories (cargo deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      - name: Security audit (cargo audit)
        run: cargo audit

  zizmor:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # upload the SARIF report to code scanning
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
