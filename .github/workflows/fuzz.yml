name: Fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # every Monday at 03:00 UTC
  workflow_dispatch:
    inputs:
      minimise:
        description: Minimise each cached corpus before the run (the weekly run always does)
        type: boolean
        default: false

# Read-only token by default; jobs that need more widen it themselves (#961).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_iff
          - fuzz_bzz
          - fuzz_jb2
          - fuzz_iw44
          - fuzz_full
          - fuzz_encode
          - fuzz_bzz_encode
          - fuzz_g4
          - fuzz_metadata
          - fuzz_graph
          - fuzz_validate
        # Seconds for one run, corpus replay included. libFuzzer executes the
        # whole cached corpus before it mutates anything, so the budget must
        # exceed the replay. Default 60 s. The IW44 corpus replays in about
        # 55-105 s even when minimised: a few inputs near the 64 MP cap carry
        # most of the time (FUZZ_CORPUS_REPLAY_BUDGET in PERF_EXPERIMENTS.md).
        include:
          - target: fuzz_iw44
            seconds: 240

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Per-target key: each fuzz binary compiles different code, avoid cache contention
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}

      # Cache the cargo-fuzz binary so cargo install --locked is a no-op on cache hit
      - name: Cache cargo-fuzz binary
        id: cargo-fuzz-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo +stable install cargo-fuzz --locked

      # Restore corpus from previous runs so coverage improves over time
      - name: Restore fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # `-timeout` is per input. It must clear the slowest input the decoder
      # caps allow, under ASan + SanCov on this runner. That is about 16x the
      # native time, on a runner about 3x slower than an Apple M1: the IW44
      # worst case under the 64 MP cap is 0.8 s native, 11.5 s on the M1 and
      # an estimated 35 s here. With 10 s, two cap-bounded inputs in the
      # cached corpus (0.26 s and 0.28 s native) failed 5 of 8 runs on
      # 2026-11-10 (FUZZ_CI_SEED_TIMEOUT in PERF_EXPERIMENTS.md).
      # Drop inputs that add no coverage. Without this the corpus only grows,
      # and its replay used the whole budget for fuzz_iw44, fuzz_jb2 and
      # fuzz_full: they generated no new inputs. Minimising costs one replay,
      # so it runs weekly and on request, not on every push.
      - name: Minimise the corpus
        if: github.event_name == 'schedule' || inputs.minimise
        run: |
          dir="fuzz/corpus/${{ matrix.target }}"
          if [ -d "$dir" ] && [ -n "$(ls -A "$dir")" ]; then
            echo "before: $(ls "$dir" | wc -l) files"
            cargo +nightly fuzz cmin ${{ matrix.target }} -- -timeout=60
            echo "after: $(ls "$dir" | wc -l) files"
          fi

      - name: Run ${{ matrix.target }} for ${{ matrix.seconds || 60 }} s
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ matrix.seconds || 60 }} -timeout=60

      # Save updated corpus (unique key ensures this run's findings are always stored)
      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
