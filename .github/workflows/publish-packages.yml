# Build, smoke-test, attest, and (optionally) publish Python wheels + npm package.
# Triggered on the same version tags as crates.io publish.yml. A failed matrix
# leg or smoke test fails the gate so an incomplete set is never published.
name: Publish packages (PyPI + npm)

on:
  push:
    tags: ['v*', 'djvu-rs-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to package (e.g. v0.27.0 or main)'
        required: true
        default: 'main'
  pull_request:
    paths:
      - 'djvu-py/**'
      - 'scripts/build_wasm_dual.sh'
      - 'scripts/third_party_notices.py'
      - 'scripts/about.toml'
      - 'scripts/check_package_versions.sh'
      - 'scripts/smoke_python_wheel.py'
      - 'scripts/smoke_npm_package.mjs'
      - 'scripts/smoke_npm_browser.mjs'
      - 'scripts/package_checksums.sh'
      - 'docs/packaging.md'
      - '.github/workflows/publish-packages.yml'
      - 'Cargo.toml'
      # A dependency bump changes the license texts that the notices step
      # reads; v0.45.0 broke there on Windows only (#986).
      - 'Cargo.lock'
      - 'Makefile'

# Read-only token by default; jobs that need more widen it themselves (#961).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve version
    # The release PR bumps Cargo.toml and djvu-py/**, so it matches the
    # pull_request path filter above and starts this workflow. Packaging it is
    # pointless — that version is not released yet — and the run reliably ends as a
    # red X on the release PR: it sits pending, then the release branch is
    # force-pushed or merged out from under it and the run fails with zero jobs
    # (#800). Skip the whole workflow there; every other job needs this one.
    # The version-lockstep guard is not lost: scripts/check_package_versions.sh
    # also runs in the CI lint job, which does report on the release PR.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      ref: ${{ steps.ref.outputs.ref }}
      is_release: ${{ steps.ref.outputs.is_release }}
      full_matrix: ${{ steps.ref.outputs.full_matrix }}
    steps:
      - name: Resolve ref
        id: ref
        # Inputs reach the script through env, never interpolated into it.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            REF="$INPUT_TAG"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            REF="$GITHUB_SHA"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

          IS_RELEASE=false
          FULL_MATRIX=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            IS_RELEASE=true
            FULL_MATRIX=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            FULL_MATRIX=true
            case "$REF" in
              v*|djvu-rs-v*) IS_RELEASE=true ;;
            esac
          fi
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "full_matrix=$FULL_MATRIX" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Check package versions
        run: bash scripts/check_package_versions.sh

      - name: Read crate version
        id: ver
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging version $VERSION (ref ${{ steps.ref.outputs.ref }})"

  python-sdist:
    name: Python sdist
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: py-sdist

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install cargo-about
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about

      # License texts of the crates linked into the extension (#949); listed in
      # pyproject `license-files`, so the sdist and every wheel carry it.
      - name: Generate third-party notices
        env:
          PYTHONUTF8: '1'  # see the wheel job below
        run: python scripts/third_party_notices.py py --out djvu-py/THIRD_PARTY_NOTICES

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --manifest-path djvu-py/Cargo.toml --out dist

      - name: Verify license files in sdist
        run: |
          set -euo pipefail
          # maturin places the workspace LICENSE next to pyproject.toml itself.
          # List first: `grep -q` exiting early would SIGPIPE tar under pipefail.
          listing="$(tar tzf dist/*.tar.gz)"
          for f in LICENSE THIRD_PARTY_NOTICES; do
            grep -q "/$f\$" <<<"$listing" || { echo "::error::sdist lacks $f"; exit 1; }
          done

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  python-wheels:
    name: Python wheels (${{ matrix.label }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: linux-x64-manylinux-pr
            os: ubuntu-latest
            target: x86_64
            manylinux: auto
            when: pr
          - label: linux-x64-manylinux
            os: ubuntu-latest
            target: x86_64
            manylinux: auto
            when: release
          - label: linux-x64-musllinux
            os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            when: release
          - label: linux-arm64-manylinux
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
            when: release
          - label: linux-arm64-musllinux
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
            when: release
          - label: macos-x64
            # macos-13 was retired by GitHub (Dec 2025); macos-15-intel is the
            # supported Intel image (through Aug 2027). Jobs on retired labels
            # queue forever, silently blocking the publish chain.
            os: macos-15-intel
            target: x86_64
            manylinux: ''
            when: release
          - label: macos-arm64
            # macos-14 was retired by GitHub on 2026-11-02; a job on it is
            # cancelled with "configuration ... is not supported".
            os: macos-15
            target: aarch64
            manylinux: ''
            when: release
          - label: windows-x64
            os: windows-latest
            target: x64
            manylinux: ''
            # Also on pull requests: Windows is the one platform whose default
            # text encoding is not UTF-8, so it fails where Linux passes (#986).
            when: always
    steps:
      - name: Decide whether to run
        id: gate
        shell: bash
        run: |
          full="${{ needs.resolve.outputs.full_matrix }}"
          when="${{ matrix.when }}"
          if [ "$when" = "always" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$full" = "true" ] && [ "$when" = "release" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$full" != "true" ] && [ "$when" = "pr" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Install Rust stable
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.run == 'true' && runner.os != 'Linux'
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.run == 'true' && runner.os == 'Linux'
        with:
          python-version: '3.12'

      - name: Install cargo-about
        if: steps.gate.outputs.run == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about

      # cargo-about ships no prebuilt binary for x86_64 macOS. install-action
      # then falls back to a source build without the `cli` feature, which
      # installs no binary and still reports success. That failed the macos-x64
      # leg of the v0.44.0 run (41231372869) and cancelled the publish.
      - name: Build cargo-about from source when no binary was installed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: command -v cargo-about || cargo install cargo-about --locked --features cli

      # `license-files` resolves next to pyproject.toml. The sdist gets the
      # workspace LICENSE there from maturin; a wheel built from the checkout
      # needs the copy (a committed one would collide in the sdist).
      - name: Generate third-party notices
        if: steps.gate.outputs.run == 'true'
        shell: bash
        # UTF-8 mode: the script reads cargo's UTF-8 output through a pipe, and
        # Python on a Windows runner decodes pipes as cp1252 by default. The
        # script sets the encoding itself now; this variable also covers a
        # rebuild of an older tag, whose copy of the script does not.
        env:
          PYTHONUTF8: '1'
        run: |
          cp LICENSE djvu-py/LICENSE
          python scripts/third_party_notices.py py --out djvu-py/THIRD_PARTY_NOTICES

      - name: Build wheels
        if: steps.gate.outputs.run == 'true'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --manifest-path djvu-py/Cargo.toml --out dist --find-interpreter
          sccache: 'true'

      # maturin silently skips a missing `license-files` entry, so check.
      - name: Verify license files in wheels
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          bad = []
          for whl in wheels:
              names = zipfile.ZipFile(whl).namelist()
              for f in ("LICENSE", "THIRD_PARTY_NOTICES"):
                  if not any(n.endswith(".dist-info/licenses/" + f) for n in names):
                      bad.append(f"{whl}: {f}")
          if not wheels or bad:
              sys.exit("missing license files: " + (", ".join(bad) or "no wheels"))
          print(f"{len(wheels)} wheels carry LICENSE + THIRD_PARTY_NOTICES")
          PY

      - name: Upload wheels
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheels-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Skip marker
        if: steps.gate.outputs.run != 'true'
        run: echo "Skipping ${{ matrix.label }} on this event"

  python-smoke:
    name: Python wheel smoke
    needs: [resolve, python-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Install wheel in clean prefix
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/djvu-wheel-venv
          /tmp/djvu-wheel-venv/bin/pip install --upgrade pip
          # Let pip pick the wheel compatible with this runner and interpreter:
          # the wheelhouse also holds arm64/macOS/Windows and other-CPython
          # wheels, so "first .whl by name" is not installable here.
          ls wheelhouse
          /tmp/djvu-wheel-venv/bin/pip install --no-index --find-links wheelhouse \
            "djvu-rs==${{ needs.resolve.outputs.version }}"
          cd /tmp
          /tmp/djvu-wheel-venv/bin/python "$GITHUB_WORKSPACE/scripts/smoke_python_wheel.py" \
            --fixture "$GITHUB_WORKSPACE/tests/fixtures/boy.djvu" \
            --expect-version "${{ needs.resolve.outputs.version }}" \
            --repo-root "$GITHUB_WORKSPACE"

  npm-package:
    name: npm package (wasm dual)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: npm-wasm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.13.1

      - name: Install cargo-about
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about

      - name: Build dual wasm package
        run: OUT="$PWD/npm-pkg" make wasm

      - name: Verify third-party notices
        run: test -s npm-pkg/THIRD_PARTY_NOTICES

      - name: Verify npm package version
        env:
          CHECK_NPM_PACKAGE: '1'
          NPM_PACKAGE_JSON: npm-pkg/package.json
        run: bash scripts/check_package_versions.sh

      - name: Pack tarball
        run: |
          set -euo pipefail
          mkdir -p npm-dist
          (cd npm-pkg && npm pack --pack-destination ../npm-dist)
          ls -la npm-dist

      - name: Upload npm artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: |
            npm-pkg/**
            npm-dist/*.tgz
          if-no-files-found: error

  npm-smoke:
    name: npm smoke (node + bundler + browser)
    needs: [resolve, npm-package]
    # Pinned: Playwright 1.53.0 cannot install Chromium on ubuntu-26.04, where
    # `ubuntu-latest` now lands ("does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download npm artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: .

      - name: Node + bundler smoke from tarball
        run: |
          set -euo pipefail
          TGZ=$(ls npm-dist/*.tgz | head -1)
          node scripts/smoke_npm_package.mjs \
            --package "$TGZ" \
            --fixture tests/fixtures/boy.djvu \
            --expect-version "${{ needs.resolve.outputs.version }}" \
            --bundler

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.53.0
          npx playwright install --with-deps chromium

      - name: Browser smoke
        run: |
          node scripts/smoke_npm_browser.mjs \
            --package npm-pkg \
            --fixture tests/fixtures/boy.djvu

  checksums-and-attest:
    name: Checksums + attestations
    needs: [resolve, python-sdist, python-wheels, python-smoke, npm-package, npm-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Download all package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: false

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( -name '*.whl' -o -name 'djvu_rs-*.tar.gz' -o -name 'djvu-rs-*.tgz' \) \
            -print -exec cp {} release-files/ \;
          if [ -f artifacts/npm-package/package.json ]; then
            cp artifacts/npm-package/package.json release-files/npm-package.json
            cp artifacts/npm-package/djvu_rs.d.ts release-files/djvu_rs.d.ts
          fi
          ls -la release-files
          test "$(find release-files -type f | wc -l)" -ge 3

      - name: Write SHA256SUMS
        run: bash scripts/package_checksums.sh release-files release-files/SHA256SUMS

      - name: Upload checksums bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-checksums
          path: release-files/
          if-no-files-found: error

      - name: Attest release files
        if: needs.resolve.outputs.is_release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-files/*'

  package-gate:
    name: Package gate
    needs: [resolve, python-sdist, python-wheels, python-smoke, npm-package, npm-smoke, checksums-and-attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete package set
        run: |
          set -euo pipefail
          echo "version=${{ needs.resolve.outputs.version }}"
          echo "All packaging jobs succeeded — set is complete."

  publish-pypi:
    name: Publish PyPI
    needs: [resolve, package-gate]
    if: needs.resolve.outputs.is_release == 'true' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels + sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  publish-npm:
    name: Publish npm
    needs: [resolve, package-gate]
    if: needs.resolve.outputs.is_release == 'true' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      # npm trusted publishing: the job proves its identity to npm with a
      # short-lived GitHub OIDC token, so the repository stores no npm token.
      # npmjs.com must list this repository, this workflow file and the `npm`
      # environment as the trusted publisher of `djvu-rs` (docs/packaging.md).
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Require npm >= 11.5.1
        run: |
          set -euo pipefail
          v="$(npm --version)"
          echo "npm $v"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm >= 11.5.1 is required for trusted publishing");
              process.exit(1);
            }
          ' "$v"

      - name: Download npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: .

      - name: Publish
        working-directory: npm-pkg
        run: npm publish --access public
