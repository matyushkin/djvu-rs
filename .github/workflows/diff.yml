name: DjVu conformance

# Reproducible differential gate and public history:
# https://matyushkin.github.io/djvu-rs/dev/conformance/

on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'examples/diff_djvulibre.rs'
      - 'examples/conformance_semantic.rs'
      - 'examples/interop_encode.rs'
      - 'scripts/conformance_report.py'
      - 'scripts/test_conformance_report.py'
      - 'conformance/**'
      - '.github/workflows/diff.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'examples/diff_djvulibre.rs'
      - 'examples/conformance_semantic.rs'
      - 'examples/interop_encode.rs'
      - 'scripts/conformance_report.py'
      - 'scripts/test_conformance_report.py'
      - 'conformance/**'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  conformance:
    name: Differential conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned DjVuLibre
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends djvulibre-bin
          banner="$(ddjvu --help 2>&1 | head -1)"
          package="$(dpkg-query --show --showformat='${Version}' djvulibre-bin)"
          test "$banner" = 'DDJVU --- DjVuLibre-3.5.28'
          echo "DJVULIBRE_ID=$banner (Ubuntu $package)" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: conformance-ubuntu

      - name: Build differential harness
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/test_conformance_report.py
          cargo build --release --features cli --example diff_djvulibre
          cargo build --release --features cli --example conformance_semantic
          cargo build --release --features cli --example interop_encode

      - name: Run complete manifest corpus
        run: |
          python3 - <<'PY' > conformance_commands.sh
          import json, shlex
          manifest = json.load(open("conformance/corpus.json"))
          base = [
              "./target/release/examples/diff_djvulibre",
              "--width", str(manifest["render"]["width"]),
              "--tolerance", str(manifest["render"]["channel_tolerance"]),
          ]
          for doc in manifest["documents"]:
              command = list(base)
              if "max_pages" in doc:
                  command += ["--max-pages", str(doc["max_pages"])]
              command.append(doc["path"])
              print(" ".join(shlex.quote(part) for part in command))
          PY
          set -o pipefail
          bash conformance_commands.sh | tee diff_results.jsonl

      - name: Compare semantic planes
        run: |
          python3 - <<'PY' > conformance_semantic_commands.sh
          import json, shlex
          manifest = json.load(open("conformance/corpus.json"))
          binary = "./target/release/examples/conformance_semantic"
          for doc in manifest["documents"]:
              command = [binary]
              if "max_pages" in doc:
                  command += ["--max-pages", str(doc["max_pages"])]
              command.append(doc["path"])
              print(" ".join(shlex.quote(part) for part in command))
          PY
          set -o pipefail
          bash conformance_semantic_commands.sh | tee semantic_results.jsonl

      - name: Validate writer interoperability
        run: |
          ./target/release/examples/interop_encode \
            tests/fixtures/boy.djvu \
            tests/fixtures/chicken.djvu | tee writer_results.txt
          cargo test --lib djvu_mut
          printf 'pass\n' > writer_status.txt

      - name: Restore published history
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --location \
            https://matyushkin.github.io/djvu-rs/dev/conformance/history.json \
            --output previous_history.json

      - name: Validate coverage and generate dashboard
        run: |
          history_arg=()
          if test -s previous_history.json; then
            history_arg=(--history-input previous_history.json)
          fi
          python3 scripts/conformance_report.py \
            --results diff_results.jsonl \
            --semantic-results semantic_results.jsonl \
            --writer-status writer_status.txt \
            --output-dir conformance_site \
            --djvulibre-version "$DJVULIBRE_ID" \
            "${history_arg[@]}"

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            diff_results.jsonl
            semantic_results.jsonl
            writer_results.txt
            writer_status.txt
            conformance_site/
          if-no-files-found: error
          retention-days: 90

      - name: Publish dashboard
        if: github.event_name != 'pull_request' && success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: conformance_site
          destination_dir: dev/conformance
          keep_files: true
