# cargo-about config for the THIRD_PARTY_NOTICES in the npm package and the
# Python wheels (#949); scripts/third_party_notices.py passes the targets.
# Mirrors the [licenses] allow-list in deny.toml; cargo-deny remains the gate
# that rejects copyleft, this file only drives notice generation.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Zlib",
    "IJG",
    "0BSD",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
