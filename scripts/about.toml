# cargo-about config for the npm package's THIRD_PARTY_NOTICES (#949).
# Mirrors the [licenses] allow-list in deny.toml; cargo-deny remains the gate
# that rejects copyleft, this file only drives notice generation.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Zlib",
    "IJG",
    "0BSD",
]
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
