# OCR real-scan evaluation set (#989).
#
# Real scanned pages with proofread text, used to measure the OCR backends
# (`ocr-onnx`, `ocr-tesseract`) on the kind of input the crate is made for.
# The protocol and the results are in `docs/ocr-model-metrics.md`.
#
# Nothing listed here is committed to this repository. Fetch the set
# explicitly with `scripts/fetch_ocr_eval_set.sh` (default destination:
# `models/ocr-eval/`, gitignored and excluded from the published crate).
# The measurement (`tests/ocr_real_scans.rs`) refuses any file whose byte
# size or SHA-256 does not match its entry here.
#
# [[scan]] — one DjVu file from Wikimedia Commons, public domain:
#   name           — stable key
#   file           — local file name
#   url            — direct download URL of the current file version
#   size, sha256   — exact byte size and lowercase hex SHA-256
#   script         — "cyrillic" or "latin"; the results are pooled by script
#   tesseract_lang — language passed to Tesseract for this scan
#   work           — author, title, year of the printed edition
#   license        — "PD": published before 1928, public domain
#   source         — the Commons description page with the license statement
#
# [[page]] — the reference text of one page: the wikitext of a validated
# Wikisource page (proofread by two people), pinned to one revision:
#   scan           — the `name` of the [[scan]] it belongs to
#   page           — 1-based page number in the DjVu file
#   file           — local file name
#   url            — raw wikitext of the pinned revision (`oldid`)
#   size, sha256   — exact byte size and lowercase hex SHA-256
# Wikisource text is CC BY-SA; that is why it is fetched and not committed.
#
# Page choice, fixed before any OCR run: per scan, take the validated pages
# whose wikitext is at least 0.6 of the scan's median size, in page order,
# and pick the pages at positions 0.1, 0.3, 0.5, 0.7 and 0.9 of that list.
#
# If Commons replaces a file, its `url` serves new bytes and the checksum
# fails. The old version stays available under `/commons/archive/`.

